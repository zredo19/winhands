[build-system]
requires = ["setuptools>=77"]  # PEP 639: license = "MIT" as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "winhands"
version = "0.3.1"
description = "Computer use MCP server for Windows: a11y tree + pixels, code mode, game-grade input"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rodolfo Obreque" }]
keywords = ["mcp", "mcp-server", "computer-use", "windows", "uiautomation", "claude", "claude-code", "ai-agents"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.2",
    "uiautomation>=2.0.29",
    "mss",
    "Pillow",
    "numpy",
    "pywin32",
    "opencv-python-headless",
    "winrt-runtime",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Globalization",
]

[project.urls]
Homepage = "https://github.com/zredo19/winhands"
Repository = "https://github.com/zredo19/winhands"
Issues = "https://github.com/zredo19/winhands/issues"

[project.scripts]
winhands = "winhands.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["winhands"]

[tool.setuptools.package-data]
winhands = ["SKILL.md"]
