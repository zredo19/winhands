[project]
name = "winhands"
version = "0.2.0"
description = "Computer use MCP server for Windows: a11y tree + pixels, code mode, game-grade input"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.2",
    "uiautomation>=2.0.29",
    "mss",
    "Pillow",
    "numpy",
    "pywin32",
    "opencv-python-headless",
    "winrt-runtime",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Globalization",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["server", "uia", "inputs", "vision", "memory", "overlay"]
